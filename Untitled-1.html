<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Topology Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Network Topology Visualizer</h1>

<div class="topology">

    <!-- Internet -->
    <div class="device internet">🌐<br>Internet</div>

    <div class="v-line"></div>

    <!-- Firewall -->
    <div class="device firewall">🛡️<br>Firewall</div>

    <div class="v-line"></div>

    <!-- Router -->
    <div class="device router">📡<br>Router</div>

    <div class="v-line"></div>

    <!-- Switch -->
    <div class="device switch">🔀<br>Switch</div>

    <div class="h-line"></div>

    <div class="devices">
        <div class="end-device">
            <div class="small-line"></div>
            💻<br>PC 1
        </div>

        <div class="end-device">
            <div class="small-line"></div>
            💻<br>PC 2
        </div>

        <div class="end-device">
            <div class="small-line"></div>
            🖥️<br>Server
        </div>

        <div class="end-device">
            <div class="small-line"></div>
            💻<br>PC 3
        </div>
    </div>

</div>

</body>
</html>
